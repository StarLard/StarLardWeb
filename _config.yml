# Star Lard site settings. Restart `jekyll serve` after changing this file.

title: "Star Lard"
description: "Indie iOS apps by Caleb Friden."
url: "https://starlard.dev"
baseurl: ""
lang: "en-US"
timezone: "America/Los_Angeles"

author:
  name: "Caleb Friden"
  email: "starlarddev@gmail.com"

# Used by jekyll-seo-tag for social cards and structured data.
logo: "/assets/images/star-lard-logo.png"
social:
  name: "Caleb Friden"
  links:
    - "https://github.com/StarLard"
    - "https://www.linkedin.com/in/calebfriden/"

links:
  github: "https://github.com/StarLard"
  linkedin: "https://www.linkedin.com/in/calebfriden/"

# Posts keep their existing URLs.
permalink: /posts/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir: _sass
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      image: "/assets/images/star-lard-logo.png"
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

include:
  - _pages

exclude:
  - vendor
  - public
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - test
  - README.md
  - CLAUDE.md
  - firebase.json
  - .firebaserc
  - .github
