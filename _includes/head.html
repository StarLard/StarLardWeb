<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#212226" media="(prefers-color-scheme: dark)">
<script>
  // Sets the theme before the page draws: the visitor's choice from the footer (Auto, Light or Dark),
  // with Auto following the system. /assets/js/theme.js wires the switcher.
  (() => {
    const key = "sl-theme";
    const media = matchMedia("(prefers-color-scheme: dark)");
    const preference = () => {
      try {
        const value = localStorage.getItem(key);
        return value === "light" || value === "dark" ? value : "auto";
      } catch { return "auto"; }
    };
    const save = (value) => {
      try {
        if (value === "auto") localStorage.removeItem(key); else localStorage.setItem(key, value);
      } catch {}
    };
    const apply = () => {
      const p = preference();
      const theme = p === "auto" ? (media.matches ? "dark" : "light") : p;
      const root = document.documentElement;
      root.dataset.theme = theme;
      root.style.colorScheme = theme;
      for (const meta of document.querySelectorAll('meta[name="theme-color"]')) {
        meta.content = theme === "dark" ? "#212226" : "#ffffff";
      }
    };
    apply();
    media.addEventListener("change", apply);
    window.slTheme = { key, preference, save, apply };
  })();
</script>
