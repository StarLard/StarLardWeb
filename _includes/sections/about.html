<section id="about" class="sl-section">
  <div class="sl-wrap sl-about">
    <div class="sl-about__text">
      <div class="sl-sign"><h2 class="sl-sign__text">About</h2></div>
      {{ page.about | markdownify }}
    </div>
    <div class="sl-board sl-contact">
      <img src="{{ '/assets/images/star-lard-tub.png' | relative_url }}" alt="" width="96" height="96">
      <h3>Get in touch</h3>
      <p class="sl-muted">Want to work together or have a question?</p>
      <a class="sl-button sl-button--primary" href="mailto:{{ site.author.email }}">Send email</a>
    </div>
  </div>
</section>
