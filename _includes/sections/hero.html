<section id="top" class="sl-hero">
  <div class="sl-wrap sl-hero__grid">
    <div class="sl-hero__text">
      <p class="sl-eyebrow">{% include star.html edge=true %} {{ page.eyebrow }}</p>
      <h1 class="sl-hero__title">{{ page.hero_title }}</h1>
      <p class="sl-hero__intro">{{ page.hero_intro }}</p>
      <div class="sl-actions">
        <a class="sl-button sl-button--primary" href="#apps">View my work</a>
        <a class="sl-button sl-button--secondary" href="#about">Get in touch</a>
      </div>
    </div>
    <div class="sl-keyart sl-hero__art">
      <img src="{{ '/assets/images/star-lard-logo-transparent.png' | relative_url }}" alt="Star Lard logo" width="512" height="512">
    </div>
  </div>
</section>
