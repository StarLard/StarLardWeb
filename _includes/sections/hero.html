<section id="hero" class="section section--hero">
  <div class="section__content">
    <div class="hero">
      <div class="hero__avatar">
        <img src="{{ site.author.avatar | relative_url }}" alt="{{ site.author.name }}">
      </div>
      <h1 class="hero__title">{{ page.hero_title | default: "Hi, I'm Caleb" }}</h1>
      <p class="hero__subtitle">{{ page.hero_subtitle | default: site.author.bio }}</p>
      <div class="hero__cta">
        <a href="#portfolio" class="btn btn--primary">View My Work</a>
        <a href="#about" class="btn btn--outline">Get in Touch</a>
      </div>
    </div>
  </div>
  <div class="hero__scroll-indicator">
    <span>Scroll</span>
    <i class="fas fa-chevron-down"></i>
  </div>
</section>
