<section id="experience" class="sl-section">
  <div class="sl-wrap sl-stack">
    <div class="sl-section__head">
      <div class="sl-sign"><h2 class="sl-sign__text">Experience</h2></div>
      <p class="sl-sign__sub">Where I've been building.</p>
    </div>
    <div class="sl-board">
      {%- for item in site.data.experience %}
      <div class="sl-timeline__row">
        <p class="sl-timeline__years">{{ item.years | escape }}</p>
        <div class="sl-timeline__role">
          <h3>{{ item.title | escape }}</h3>
          <p>{{ item.summary | escape }}</p>
        </div>
      </div>
      {%- endfor %}
    </div>
  </div>
</section>
