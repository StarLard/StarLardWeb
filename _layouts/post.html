---
layout: default
---
{%- assign words = content | number_of_words -%}
<article class="sl-page">
  <div class="sl-wrap">
    <div class="sl-article">
      <header class="sl-article__head">
        <a class="sl-article__back" href="{{ '/posts/' | relative_url }}">← All posts</a>
        <p class="sl-eyebrow">{% include star.html edge=true %} {{ page.date | date: "%b %-d, %Y" }} · {{ words | divided_by: 200 | plus: 1 }} min read</p>
        <h1 class="sl-article__title">{{ page.title }}</h1>
      </header>
      <div class="sl-prose">
        {{ content }}
      </div>
    </div>
  </div>
</article>
